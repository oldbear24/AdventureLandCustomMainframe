name: Test, build and publish Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Test backend
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser and game bridge with local fixtures
        run: npm run test:browser

  docker:
    name: Build, smoke test and publish
    if: github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image names
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "latest=${image}:latest" >> "$GITHUB_OUTPUT"
          echo "commit=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Adventure Land Custom Mainframe
            org.opencontainers.image.description=Self-hosted Adventure Land character runtime and control panel
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test generated-certificate HTTPS and Chromium inside image
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name mainframe-smoke --init \
            --publish 127.0.0.1:3000:3000 \
            --env ADMIN_PASSWORD=ci-smoke-test-password-only \
            "$IMAGE"
          cert="$(mktemp)"
          trap 'docker logs mainframe-smoke; docker rm --force mainframe-smoke; rm -f "$cert"' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec mainframe-smoke cat /app/data/tls/cert.pem > "$cert" 2>/dev/null \
              && curl --fail --silent --cacert "$cert" https://localhost:3000/healthz; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent --cacert "$cert" https://127.0.0.1:3000/ | grep -q 'Vlastní mainframe'
          if curl --silent --max-time 5 http://127.0.0.1:3000/healthz; then echo "HTTP must not be served"; exit 1; fi
          docker exec mainframe-smoke node src/healthcheck.js
          docker exec mainframe-smoke node --input-type=module -e '
            import assert from "node:assert/strict";
            import { chromium } from "playwright";
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              await page.setContent("<h1>Chromium ready</h1>");
              assert.equal(await page.locator("h1").textContent(), "Chromium ready");
              console.log("Chromium smoke test passed");
            } finally { await browser.close(); }
          '
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test direct HTTPS and login inside image
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          certs="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$certs/privkey.pem" -out "$certs/fullchain.pem"
          chmod 755 "$certs"
          sudo chown 1000:1000 "$certs/privkey.pem"
          sudo chmod 600 "$certs/privkey.pem"
          docker run --detach --name mainframe-https-smoke --init \
            --publish 127.0.0.1:3443:3000 \
            --mount "type=bind,source=$certs,target=/app/certs,readonly" \
            --env ADMIN_USERNAME=tls-operator \
            --env ADMIN_PASSWORD=ci-smoke-test-password-only \
            --env TLS_CERT_FILE=/app/certs/fullchain.pem \
            --env TLS_KEY_FILE=/app/certs/privkey.pem \
            --env PUBLIC_ORIGIN=https://localhost:3443 \
            "$IMAGE"
          trap 'docker logs mainframe-https-smoke; docker rm --force mainframe-https-smoke; rm -rf "$certs"' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --cacert "$certs/fullchain.pem" https://localhost:3443/healthz; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec mainframe-https-smoke node src/healthcheck.js
          curl --fail --silent --show-error --cacert "$certs/fullchain.pem" \
            --header 'Origin: https://localhost:3443' --header 'Content-Type: application/json' \
            --data '{"username":"tls-operator","password":"ci-smoke-test-password-only"}' \
            --dump-header "$certs/login-headers" --cookie-jar "$certs/cookies" \
            https://localhost:3443/api/login
          grep -iq 'set-cookie:.*; Secure' "$certs/login-headers"
          curl --fail --silent --show-error --cacert "$certs/fullchain.pem" \
            --cookie "$certs/cookies" https://localhost:3443/api/dashboard > /dev/null
      - name: Publish verified image
        env:
          LATEST_IMAGE: ${{ steps.image.outputs.latest }}
          COMMIT_IMAGE: ${{ steps.image.outputs.commit }}
        shell: bash
        run: |
          docker push "$COMMIT_IMAGE"
          docker push "$LATEST_IMAGE"
          {
            echo '### Docker image'
            echo "- Latest: \`$LATEST_IMAGE\`"
            echo "- This commit: \`$COMMIT_IMAGE\`"
            echo '- Platform: linux/amd64'
            echo '- Backend, browser bridge, generated and own-certificate HTTPS login, TLS healthcheck and Chromium smoke tests passed.'
          } >> "$GITHUB_STEP_SUMMARY"
