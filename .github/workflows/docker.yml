name: Test, build and publish Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Test backend
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser and game bridge with local fixtures
        run: npm run test:browser

  docker:
    name: Build, smoke test and publish
    if: github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image names
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "latest=${image}:latest" >> "$GITHUB_OUTPUT"
          echo "commit=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Adventure Land Custom Mainframe
            org.opencontainers.image.description=Self-hosted Adventure Land character runtime and control panel
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test application and Chromium inside image
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name mainframe-smoke --init \
            --publish 127.0.0.1:3000:3000 \
            --env ADMIN_PASSWORD=ci-smoke-test-password-only \
            "$IMAGE"
          trap 'docker logs mainframe-smoke; docker rm --force mainframe-smoke' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'Vlastní mainframe'
          docker exec mainframe-smoke node --input-type=module -e '
            import assert from "node:assert/strict";
            import { chromium } from "playwright";
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              await page.setContent("<h1>Chromium ready</h1>");
              assert.equal(await page.locator("h1").textContent(), "Chromium ready");
              console.log("Chromium smoke test passed");
            } finally { await browser.close(); }
          '
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          LATEST_IMAGE: ${{ steps.image.outputs.latest }}
          COMMIT_IMAGE: ${{ steps.image.outputs.commit }}
        shell: bash
        run: |
          docker push "$COMMIT_IMAGE"
          docker push "$LATEST_IMAGE"
          {
            echo '### Docker image'
            echo "- Latest: \`$LATEST_IMAGE\`"
            echo "- This commit: \`$COMMIT_IMAGE\`"
            echo '- Platform: linux/amd64'
            echo '- Backend, browser bridge, container startup and Chromium smoke tests passed.'
          } >> "$GITHUB_STEP_SUMMARY"
