# Direct HTTPS using the published image and mounted PEM files.
services:
  mainframe:
    image: ${MAINFRAME_IMAGE:-ghcr.io/oldbear24/adventurelandcustommainframe:latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      TLS_ENABLED: "true"
      TLS_CERT_FILE: /app/certs/fullchain.pem
      TLS_KEY_FILE: /app/certs/privkey.pem
      COOKIE_SECURE: "true"
    ports:
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:3000"
    volumes:
      - mainframe-data:/app/data
      - type: bind
        source: ${TLS_CERTS_DIR:-./certs}
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false
    shm_size: "512mb"
    mem_limit: "2g"
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mainframe-data:
